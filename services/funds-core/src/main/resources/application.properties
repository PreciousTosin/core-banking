# Every property below except the application name is pinned by PackagingContractTest
# (CONTROLLED_PROPERTIES); README "Memory boundary" and docs/health-contract.md describe
# the limits. Change value, test and documents together.
quarkus.application.name=funds-core
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.leak-detection-interval=30S
# The runtime login is funds_app and never migrates; the operator job runs as funds_migrator
# and only the test profile re-enables Flyway (README "Database roles and startup").
quarkus.flyway.migrate-at-start=false
quarkus.thread-pool.core-threads=2
quarkus.thread-pool.prefill=true
quarkus.thread-pool.max-threads=8
quarkus.thread-pool.queue-size=32
quarkus.thread-pool.growth-resistance=0.0
# Consumed by PostingTransactionTimeouts, which requires lock < statement < idle and applies
# them per transaction before any financial read or lock (ACC-25).
funds.posting.lock-timeout=1S
funds.posting.statement-timeout=3S
funds.posting.idle-transaction-timeout=5S
quarkus.http.limits.max-body-size=128K
quarkus.micrometer.export.prometheus.enabled=true

# Packaged runtimes receive these values from mounted deployment configuration
# and secrets. Tests use Dev Services and their test-profile overrides.
# ProdDatasourceStartupGuard fails startup if any of the four resolves missing or blank.
%prod.quarkus.datasource.active=true
%prod.quarkus.datasource.jdbc.url=${FUNDS_DB_JDBC_URL}
%prod.quarkus.datasource.username=${FUNDS_APP_DB_USER}
%prod.quarkus.datasource.password=${FUNDS_APP_DB_PASSWORD}
